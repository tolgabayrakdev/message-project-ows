<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <div id="auth-screen" class="screen">
      <div class="auth-container">
        <h1 class="logo">Sohbet</h1>
        <div class="tabs">
          <button class="tab active" data-tab="login">Giriş</button>
          <button class="tab" data-tab="register">Kayıt</button>
        </div>
        
        <form id="login-form" class="auth-form">
          <input type="tel" id="login-phone" placeholder="Telefon (5xx xxx xx xx)" maxlength="14" required>
          <input type="password" id="login-password" placeholder="Şifre" required>
          <button type="submit">Giriş Yap</button>
        </form>
        
        <form id="register-form" class="auth-form hidden">
          <input type="text" id="reg-username" placeholder="Kullanıcı Adı" minlength="3" maxlength="20" required>
          <input type="tel" id="reg-phone" placeholder="Telefon (5xx xxx xx xx)" maxlength="14" required>
          <input type="password" id="reg-password" placeholder="Şifre" minlength="4" required>
          <button type="submit">Kayıt Ol</button>
        </form>
      </div>
    </div>

    <div id="chat-screen" class="screen">
      <header class="chat-header">
        <button id="menu-toggle" class="icon-btn">☰</button>
        <div class="user-info">
          <span class="online-dot"></span>
          <span id="current-user"></span>
        </div>
        <button id="logout-btn" class="icon-btn" title="Çıkış">✕</button>
      </header>
      
      <div class="chat-layout">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <aside class="rooms-sidebar">
          <div class="rooms-header">
            <h3>Odalar</h3>
            <button id="new-room-btn" class="icon-btn">+</button>
          </div>
          <ul id="rooms-list"></ul>
        </aside>
        
        <main class="chat-main">
          <div id="messages-container"></div>
          <form id="message-form">
            <input type="text" id="message-input" placeholder="Mesaj yaz..." autocomplete="off">
            <button type="submit">Gönder</button>
          </form>
        </main>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
